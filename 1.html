<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frosted Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ---------- RESET ---------- */
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;

      /* Example animated / image background */
      background:
        radial-gradient(circle at 20% 30%, #6a5acd55, transparent 40%),
        radial-gradient(circle at 80% 70%, #9b59b655, transparent 40%),
        linear-gradient(120deg, #0f2027, #203a43, #2c5364);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- MAIN GLASS CARD ---------- */
    .glass-card {
      width: 1100px;
      max-width: 95vw;
      min-height: 620px;

      display: grid;
      grid-template-columns: 1fr 1.3fr;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255,255,255,0.05);

      overflow: hidden;
    }

    /* ---------- LEFT COLUMN ---------- */
    .left {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(255,255,255,0.12);
    }

    .profile {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.35);
      /* replace with background-image later */
    }

    .name {
      font-size: 32px;
      font-weight: 700;
      color: white;
    }

    .bio {
      color: rgba(255,255,255,0.75);
      line-height: 1.5;
      max-width: 320px;
    }

    .left-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 28px;
    }

    /* ---------- RIGHT COLUMN ---------- */
    .right {
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section h2 {
      margin: 0 0 6px 0;
      color: white;
      font-size: 26px;
    }

    .section p {
      margin: 0 0 18px 0;
      color: rgba(255,255,255,0.65);
    }

    /* ---------- BUTTONS ---------- */
    .pill {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 14px 20px;
      border-radius: 999px;

      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      text-decoration: none;
      font-weight: 500;

      transition: all 0.2s ease;
      cursor: pointer;
    }

    .pill:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-1px);
    }

    .icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: rgba(255,255,255,0.35);
      /* placeholder for icons */
    }

    .pill-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 360px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .glass-card {
        grid-template-columns: 1fr;
      }

      .left {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.12);
      }
    }
  </style>
</head>

<body>

  <div class="glass-card">

    <!-- LEFT -->
    <div class="left">
      <div class="profile">
        <div class="avatar"></div>

        <div class="name">YourName</div>

        <div class="bio">
          Short bio goes here.  
          Game developer, content creator, or whatever you want.
        </div>

        <div class="left-buttons">
          <div class="pill">
            <div class="icon"></div>
            Contacts
          </div>

          <div class="pill">
            <div class="icon"></div>
            Links
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

      <div class="section">
        <h2>My Projects</h2>
        <p>
          From games to channels.  
          Add your projects here.
        </p>

        <div class="pill-group">
          <div class="pill">
            <div class="icon"></div>
            Games
          </div>

          <div class="pill">
            <div class="icon"></div>
            Channels
          </div>

          <div class="pill">
            <div class="icon"></div>
            Other
          </div>
        </div>
      </div>

      <div class="section">
        <h2>My Collections</h2>
        <p>
          Rare or valuable items you've collected.
        </p>

        <div class="pill-group">
          <div class="pill">
            <div class="icon"></div>
            Roblox
          </div>

          <div class="pill">
            <div class="icon"></div>
            CS
          </div>

          <div class="pill">
            <div class="icon"></div>
            Other
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
